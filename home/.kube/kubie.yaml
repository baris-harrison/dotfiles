# kubie: `kctx` / `kns` open a subshell with its own copy of the chosen
# context, so switching in one tab never affects another.
# Kubeconfigs themselves are never committed: keep one file per cluster in
# ~/.kube/configs/ (kind writes its clusters to ~/.kube/config).
configs:
  include:
    - ~/.kube/config
    - ~/.kube/configs/*.yaml
    - ~/.kube/configs/*.yml
prompt:
  # starship already shows the context; don't add kubie's own prompt prefix
  disable: true
