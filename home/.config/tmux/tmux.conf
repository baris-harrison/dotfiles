# tmux: terminals that keep running after Ghostty closes. No plugin manager.
# Prefix is the default Ctrl-b.   Cheat sheet:
#   prefix |  / -    split side-by-side / stacked (in current folder)
#   prefix c         new window          prefix s   switch session (tree)
#   prefix d         detach (everything keeps running; `tmux a` to return)
#   prefix r         reload this file    prefix [   scroll/copy mode (vi keys)

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# Windows and panes count from 1, renumber when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits and new windows open in the current pane's folder
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes with prefix + h/j/k/l
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

setw -g mode-keys vi
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Status bar: session name left (ghost sessions are repo_branch), clock right
set -g status-position top
set -g status-style "bg=default,fg=colour245"
set -g status-left-length 40
set -g status-left "#[fg=cyan,bold]#S #[default]"
set -g status-right "%H:%M"
setw -g window-status-current-style "fg=white,bold"
