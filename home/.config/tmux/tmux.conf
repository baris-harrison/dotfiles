# tmux: terminals that keep running after Ghostty closes.
# Prefix is Ctrl+Space.   Cheat sheet:
#   prefix |  / -    split side-by-side / stacked (in current folder)
#   prefix h/j/k/l   move between panes
#   prefix c         new window          prefix s   switch session (tree)
#   prefix d         detach (everything keeps running; `tmux a` to return)
#   prefix r         reload this file    prefix [   scroll/copy mode (vi keys)
#   prefix H         cheat sheet pop-up (~/.config/cheatsheet.md)
# Built-in keys you get without any config:
#   panes     o next, ; previous, arrow keys move
#   sessions  s list, w list with windows, ( previous, ) next, L last session
#   closing   x pane, & window (both ask first)
# Note: bind l below replaces tmux's default "last window".

# Required for Claude Code
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# True color, so the theme isn't washed out inside tmux
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# Quality of life
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10
set -g set-clipboard on
setw -g mode-keys vi
set -g detach-on-destroy off

# Windows and panes count from 1, renumber when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Panes run non-login shells: the login shell that started tmux already set up the
# environment, and panes inherit the server's. Restart the tmux server to pick up
# login-shell changes.
set -g default-command "${SHELL}"

# Prefix is Ctrl+Space instead of tmux's default Ctrl+b
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Splits and new windows open in the current pane's folder
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
# Cheat sheet as a pop-up, rendered by glow
bind H display-popup -E -w 80% -h 80% "glow -p ~/.config/cheatsheet.md"

# Window tabs show the running program (zsh, claude, vim, k9s) instead of the Mac's name
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Plugins (tpm, installed by install.sh): the theme loads here, near the end of the file
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.2'
if-shell 'defaults read -g AppleInterfaceStyle' "set -g @catppuccin_flavor 'mocha'" "set -g @catppuccin_flavor 'latte'"
run '~/.config/tmux/plugins/tpm/tpm'
set -g pane-border-lines heavy

# Right side of the bar: session (red while the prefix is held), date and time.
# These must come after the run line, because the theme creates these pieces when it loads.
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_session}#{E:@catppuccin_status_date_time}"

# Label each pane with its repo (or folder outside a repo), so side-by-side panes are easy
# to tell apart. zsh sets @label on every cd (60-tmux.zsh), so there is no #() polling.
# Panes not running zsh fall back to their folder's name.
set -g pane-border-status top
set -g pane-border-format ' #{?@label,#{@label},#{b:pane_current_path}} '
