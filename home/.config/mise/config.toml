# mise manages every pinned toolchain (no tenv/tfenv). Global defaults here;
# repos override with their own .mise.toml so they match their CI, e.g.
#   [tools]
#   terraform = "1.9.8"
#   terragrunt = "0.67.16"
#   kubectl = "1.31"

[tools]
kubectl = "latest"
helm = "latest"
terraform = "latest"
terragrunt = "latest"
# opentofu = "latest"
python = "3.13"
node = "lts"
