# Prompt answers "where am I and what can I break?" at a glance.
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
command_timeout = 500

format = """
$directory$git_branch$git_status$kubernetes$aws$terraform$cmd_duration
$character"""

[directory]
truncation_length = 3
truncate_to_repo = true

[git_status]
format = '([$all_status$ahead_behind]($style) )'

[kubernetes]
disabled = false
format = '[⎈ $context( \($namespace\))]($style) '
style = "cyan"

# Anything matching *prod* turns loud red.
[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bold red"

[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:(?P<region>[\\w-]+):\\d+:cluster/(?P<cluster>[\\w-]+)"
context_alias = "eks:$cluster"

[aws]
format = '[☁ $profile( \($region\))( $duration)]($style) '
style = "yellow"

[aws.region_aliases]
us-east-1 = "use1"
us-west-2 = "usw2"
eu-west-1 = "euw1"

[terraform]
format = '[tf:$workspace]($style) '

[cmd_duration]
min_time = 2000
format = '[⏱ $duration]($style) '
