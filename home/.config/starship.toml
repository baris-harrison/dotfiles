[kubernetes]
disabled = false
format = '[⎈ $context( \($namespace\))]($style) '

[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bold red"

[aws]
format = '[☁ $profile( $region)]($style) '

[terraform]
format = '[tf $workspace]($style) '

# Inside a repo the path starts at the repo root; keep it in view and make the repo name stand out
[directory]
truncation_length = 8
truncate_to_repo = true
repo_root_style = "bold underline cyan"
